# DataDock via Docker Compose.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# On first run, open the published URL and create the first Admin account
# (see the "Admin Settings" section of the README). Put a TLS-terminating
# reverse proxy in front for anything beyond localhost (see Caddyfile).
services:
  datadock:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: "compose"
    image: datadock:latest
    # Publish only to the host loopback; let the proxy terminate TLS and
    # forward to it. Change to "8080:8080" to expose directly (plain HTTP).
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - datadock-data:/data
    environment:
      # Encrypt stored secrets (connection DSNs, LLM keys) at rest. Provide a
      # 32-byte AES key as hex or base64, and switch to an encryptable mode.
      # DATADOCK_STORAGE_MODE: "disk"
      # DATADOCK_ENCRYPTION_KEY: "<32-byte hex or base64>"
      #
      # Set when a TLS-terminating proxy sits in front, so the session cookie
      # is marked Secure even though the container only sees plain HTTP.
      DATADOCK_BEHIND_TLS_PROXY: "true"
    restart: unless-stopped
    # Mirrors the image HEALTHCHECK; harmless to keep explicit for `compose ps`.
    healthcheck:
      test: ["CMD", "/usr/local/bin/datadock", "-addr", ":8080", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  datadock-data:
